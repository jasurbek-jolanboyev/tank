# Direct macOS host profile. Cameras and ESP32 must be connected to the Mac,
# not passed through to VMware. On this Mac the built-in FaceTime camera is
# index 0, so external USB cameras deliberately start at indexes 1–4.
version: 1
mode: DEVELOPMENT
rest: {host: "${TANK_SERVER_HOST}", port: 8080}
websocket: {port: 8081}
ai:
  type: onnx
  model: "${TANK_MODEL_PATH}"
  format: yolo_v8
  classes: [drone, bird, aircraft, unknown_air_object]
  confidence: 0.70
  iou: 0.45
policy:
  minimumConfidence: 0.70
  confirmationFrames: 3
  confirmationWindowMs: 1200
  minimumTrackAgeMs: 250
  maximumGapMs: 450
  trackTimeoutMs: 2000
  nearEnterMeters: 20.0
  nearExitMeters: 22.0
  nearEnterSamples: 3
  nearExitSamples: 3
  distanceFilterWindow: 5
  distanceFilterAlpha: 0.35
  distanceOutlierMeters: 8.0
  requireApproachingForRed: false
  maximumRangeAgeMs: 500
range: {source: esp32}
recording: {enabled: true, directory: recordings, maxBytes: 104857600, backupCount: 5}
cameras:
  # The Mac built-in camera (index 0) is intentionally excluded: these four
  # feeds are the physical sector cameras used for AI and indicator decisions.
  - {id: CAM_FRONT_1, enabled: true, type: webcam, source: 1, sector: FRONT_1, width: 640, height: 480, captureFps: 15, aiFps: 5, previewFps: 10, jpegQuality: 80, preferMjpeg: true, macosNativeDefaults: true, rotation: 0, flip: false}
  - {id: CAM_FRONT_2, enabled: true, type: webcam, source: 2, sector: FRONT_2, width: 640, height: 480, captureFps: 15, aiFps: 5, previewFps: 10, jpegQuality: 80, preferMjpeg: true, macosNativeDefaults: true, rotation: 0, flip: false}
  - {id: CAM_RIGHT_1, enabled: true, type: webcam, source: 3, sector: RIGHT_1, width: 640, height: 480, captureFps: 15, aiFps: 5, previewFps: 10, jpegQuality: 80, preferMjpeg: true, macosNativeDefaults: true, rotation: 0, flip: false}
  - {id: CAM_RIGHT_2, enabled: true, type: webcam, source: 4, sector: RIGHT_2, width: 640, height: 480, captureFps: 15, aiFps: 5, previewFps: 10, jpegQuality: 80, preferMjpeg: true, macosNativeDefaults: true, rotation: 0, flip: false}
esp32Nodes:
  - {nodeId: NODE-01, sectors: [FRONT_1, FRONT_2, RIGHT_1, RIGHT_2], transport: serial, endpoint: auto, baudRate: 115200}
