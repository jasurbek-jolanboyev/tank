version: 1
mode: UBUNTU_VM_REAL
rest: {host: "${TANK_SERVER_HOST}", port: 8080}
websocket: {port: 8081}
ai:
  type: onnx
  model: ${TANK_MODEL_PATH}
  format: yolo_v8
  classes: [drone, bird, aircraft, unknown_air_object]
policy:
  minimumConfidence: 0.70
  confirmationFrames: 3
  confirmationWindowMs: 1200
  minimumTrackAgeMs: 250
  maximumGapMs: 450
  trackTimeoutMs: 2000
  nearEnterMeters: 20.0
  nearExitMeters: 22.0
  requireApproachingForRed: false
  maximumRangeAgeMs: 500
range: {source: esp32}
recording: {enabled: true, directory: /var/lib/tank/recordings, maxBytes: 104857600, backupCount: 5}
cameras:
  - {id: CAM_FRONT_1, enabled: true, type: rtsp, source: "${TANK_CAM_FRONT_1_RTSP}",
     sector: FRONT_1, width: 1280, height: 720, captureFps: 15, aiFps: 5,
     previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_FRONT_2, enabled: true, type: rtsp, source: "${TANK_CAM_FRONT_2_RTSP}", sector: FRONT_2, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_RIGHT_1, enabled: true, type: rtsp, source: "${TANK_CAM_RIGHT_1_RTSP}", sector: RIGHT_1, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_RIGHT_2, enabled: true, type: rtsp, source: "${TANK_CAM_RIGHT_2_RTSP}", sector: RIGHT_2, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_REAR_1, enabled: true, type: rtsp, source: "${TANK_CAM_REAR_1_RTSP}", sector: REAR_1, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_REAR_2, enabled: true, type: rtsp, source: "${TANK_CAM_REAR_2_RTSP}", sector: REAR_2, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_LEFT_1, enabled: true, type: rtsp, source: "${TANK_CAM_LEFT_1_RTSP}", sector: LEFT_1, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
  - {id: CAM_LEFT_2, enabled: true, type: rtsp, source: "${TANK_CAM_LEFT_2_RTSP}", sector: LEFT_2, width: 1280, height: 720, captureFps: 15, aiFps: 5, previewFps: 5, rotation: 0, flip: false}
esp32Nodes:
  - nodeId: NODE-01
    sectors: [FRONT_1, FRONT_2, RIGHT_1, RIGHT_2]
    transport: serial
    endpoint: "${TANK_ESP32_NODE_01_DEVICE}"
    baudRate: 115200
  - nodeId: NODE-02
    sectors: [REAR_1, REAR_2, LEFT_1, LEFT_2]
    transport: serial
    endpoint: "${TANK_ESP32_NODE_02_DEVICE}"
    baudRate: 115200
